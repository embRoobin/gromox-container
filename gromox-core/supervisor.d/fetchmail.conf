[program:fetchmail]
command=/usr/bin/fetchmail --daemon 60 --nodetach --smtphost localhost/2525 -f /etc/fetchmailrc --sslcertck
priority=80
startsecs=5
autostart=true
autorestart=true
user=fetchmail
environment=HOME="/var/lib/fetchmail"
stdout_logfile=/var/log/supervisor-fetchmail.log
stderr_logfile=/var/log/supervisor-fetchmail-err.log
